:root{
  color-scheme:light dark;
  --bg:#E9EEF1; --slot:#F8FAFB; --edge:#C6D1D9; --edge-strong:#9DACB8; --panel:#FFFFFF;
  --ink:#17202A; --muted:#566573; --sticker:#FFFFFF; --sticker-ink:#17202A;
  --gold:#F2B300; --heat-base:#F8FAFB; --heat-flat:#F8E2A6; --ring:rgba(23,32,42,.5); --gloss:rgba(255,255,255,.75);
  --primary:#17202A; --primary-ink:#FFFFFF; --danger:#B3261E; --danger-ink:#FFFFFF;
  --num:"Barlow Semi Condensed","Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --text:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#11161B; --slot:#1A2128; --edge:#2D3841; --edge-strong:#46545F; --panel:#182027;
    --ink:#E6EBEF; --muted:#97A5B1; --sticker:#E6EAED; --sticker-ink:#131A21;
    --gold:#EBAA00; --heat-base:#23211C; --heat-flat:#5A4A1E; --ring:rgba(230,235,239,.55); --gloss:rgba(255,255,255,.04);
    --primary:#E6EBEF; --primary-ink:#11161B; --danger:#FF8A80; --danger-ink:#11161B;
  }
}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:400 16px/1.4 var(--text);-webkit-text-size-adjust:100%;text-size-adjust:100%;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{touch-action:manipulation}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.visually-hidden{position:absolute!important;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* ---------- shell ---------- */
.app{
  height:100vh;height:100dvh;max-width:1000px;margin:0 auto;
  display:grid;grid-template-columns:minmax(0,1fr);
  grid-template-rows:auto auto minmax(0,1fr) auto auto;
  grid-template-areas:"top" "banners" "main" "lastbar" "tabs";
  padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
}
.top{grid-area:top;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:10px 14px 8px}
.top h1{margin:0;font:700 21px/1.1 var(--num);letter-spacing:.005em}
.top .sub{margin:3px 0 0;font-size:14px;color:var(--muted)}
.total{margin:0;text-align:right;line-height:1;white-space:nowrap}
.total b{display:block;font:700 36px/.95 var(--num);font-variant-numeric:tabular-nums}
.total span{font-size:13px;color:var(--muted)}
.banners{grid-area:banners;padding:0 10px}
.banner{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin:0 0 8px;padding:10px 12px;border:1px solid var(--edge-strong);border-radius:12px;background:var(--panel);font-size:14px}
.banner p{margin:0;flex:1 1 200px}
.banner.warn{border-color:var(--danger)}
main{grid-area:main;min-height:0;position:relative}
.view{height:100%;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
#view-count{overflow:hidden;display:flex;flex-direction:column;justify-content:center;padding:2px 10px 4px}

/* ---------- the case ---------- */
.grid{flex:1 1 auto;min-height:0;max-height:760px;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));grid-template-rows:repeat(6,minmax(0,1fr));gap:5px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.cell{appearance:none;-webkit-appearance:none;position:relative;margin:0;padding:0;min-width:0;min-height:0;border:1px solid var(--edge);border-radius:9px;background:var(--slot);color:var(--ink);cursor:pointer;container-type:size;box-shadow:inset 0 1px 0 var(--gloss);transition:transform .08s ease-out}
.mcell{background:var(--slot)}
.cell.sold,.mcell.sold{background:var(--heat-flat)}
@supports (background:color-mix(in oklab,red 50%,blue)){
  .cell.sold,.mcell.sold{background:color-mix(in oklab,var(--gold) var(--hp,0%),var(--heat-base))}
}
.cell:active{transform:scale(.96)}
.in{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7%}
.sticker{display:inline-block;min-width:1.6em;padding:.13em .22em .09em;border-radius:.2em;background:var(--sticker);color:var(--sticker-ink);font:700 20px/1 var(--num);text-align:center;font-variant-numeric:tabular-nums;box-shadow:0 1px 0 rgba(0,0,0,.2),0 0 0 1px rgba(0,0,0,.07)}
.count{min-height:1em;font:700 16px/1 var(--num);font-variant-numeric:tabular-nums}
.cell .sticker{font-size:clamp(12px,min(46cqi,27cqb),30px)}
.cell .count{font-size:clamp(11px,min(38cqi,22cqb),26px)}
@container (min-aspect-ratio:3/2){
  .in{flex-direction:row;gap:9%}
  .cell .sticker{font-size:clamp(12px,min(26cqi,46cqb),30px)}
  .cell .count{font-size:clamp(11px,min(22cqi,40cqb),26px)}
  .cell .count:empty{display:none}
}
.cell.hit{animation:ring .38s ease-out}
.cell.hit .count{animation:pop .3s ease-out}
@keyframes ring{from{box-shadow:0 0 0 0 var(--ring),inset 0 1px 0 var(--gloss)}to{box-shadow:0 0 0 8px transparent,inset 0 1px 0 var(--gloss)}}
@keyframes pop{from{transform:scale(1.4)}to{transform:scale(1)}}
@keyframes fade{from{box-shadow:0 0 0 3px var(--ring)}to{box-shadow:0 0 0 3px transparent}}
@media (prefers-reduced-motion:reduce){
  .cell{transition:none}.cell:active{transform:none}
  .cell.hit{animation:fade .45s linear}.cell.hit .count{animation:none}
}

/* ---------- last action ---------- */
.lastbar{grid-area:lastbar;display:flex;align-items:center;gap:12px;padding:8px 12px}
.lastbar p{flex:1;min-width:0;margin:0;font-size:15px;color:var(--muted)}
.lastbar p b{color:var(--ink);font:700 19px/1 var(--num)}
#undoBtn{min-width:100px}

/* ---------- buttons ---------- */
.btn{appearance:none;-webkit-appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border:1px solid var(--edge-strong);border-radius:11px;background:var(--panel);color:var(--ink);font:600 15px/1.1 var(--text);cursor:pointer}
.btn:disabled{opacity:.42;cursor:default}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn.danger-fill{background:var(--danger);border-color:var(--danger);color:var(--danger-ink)}
.btn.small{min-height:36px;padding:0 12px;font-size:14px}
.btn.wide{width:100%;min-height:50px;font-size:16px}
.btn.textbtn{border-color:transparent;background:none}
.btn.danger{color:var(--danger)}

/* ---------- tabs ---------- */
.tabs{grid-area:tabs;display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--edge);padding-bottom:env(safe-area-inset-bottom)}
.tabs button{appearance:none;position:relative;min-height:52px;border:0;background:none;color:var(--muted);font:600 15px/1 var(--text);cursor:pointer}
.tabs button[aria-current="page"]{color:var(--ink)}
.tabs button[aria-current="page"]::before{content:"";position:absolute;top:-1px;left:24%;right:24%;height:3px;border-radius:0 0 3px 3px;background:var(--ink)}

/* ---------- end of day ---------- */
.pane{max-width:640px;margin:0 auto;padding:4px 14px 28px}
.pane h2{margin:4px 0 2px;font:700 26px/1.15 var(--num)}
.lede{margin:0 0 4px;font-size:15px}
.hint{margin:0 0 10px;font-size:14px;color:var(--muted)}
.rowhead,.row{display:grid;grid-template-columns:44px minmax(0,1fr) 86px 86px;align-items:center;gap:10px}
.rowhead{position:sticky;top:0;z-index:1;padding:8px 0 6px;border-bottom:1px solid var(--edge);background:var(--bg);font-size:13px;color:var(--muted)}
.rows{list-style:none;margin:0;padding:0}
.row{padding:7px 0;border-bottom:1px solid var(--edge)}
.row .sticker{justify-self:start;font-size:19px}
.sold{display:flex;align-items:center;gap:8px;min-width:0}
.sold b{min-width:1.4em;text-align:right;font:700 22px/1 var(--num);font-variant-numeric:tabular-nums}
.row.zero .sold b{color:var(--muted)}
.bar{flex:1;height:6px;border-radius:3px;background:var(--edge);overflow:hidden}
.bar i{display:block;width:0;height:100%;border-radius:3px;background:var(--gold)}
.step{display:flex;gap:6px}
.step .btn{width:40px;min-height:40px;padding:0;border-radius:10px;font-size:22px}
.lastnum{display:block}
.lastnum input{width:100%;height:40px;padding:0 6px;border:1px solid var(--edge-strong);border-radius:10px;background:var(--panel);color:var(--ink);font:700 19px/1 var(--num);text-align:center;font-variant-numeric:tabular-nums}
.lastnum input::placeholder{color:var(--muted);opacity:.6}
.lastnum small{display:block;margin-top:2px;text-align:center;font-size:12px;color:var(--muted)}
.lastnum small:empty{display:none}
.eod-actions{display:grid;gap:8px;margin-top:20px}

/* ---------- history ---------- */
.exports{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.btn.exp{flex-direction:column;align-items:flex-start;justify-content:center;gap:3px;min-height:66px;padding:10px 12px;border-radius:12px;text-align:left}
.btn.exp small{font:400 13px/1.25 var(--text);color:var(--muted)}
.note{margin:10px 0 16px;font-size:13px;color:var(--muted)}
.days{list-style:none;margin:0;padding:0;border-top:1px solid var(--edge)}
.dayrow{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 2px;border:0;border-bottom:1px solid var(--edge);background:none;text-align:left;cursor:pointer}
.dayrow .d{display:block;font-weight:600}
.dayrow small{display:block;margin-top:2px;font-size:13px;color:var(--muted)}
.dayrow b{font:700 26px/1 var(--num);font-variant-numeric:tabular-nums}
.empty{margin:16px 0;font-size:15px;color:var(--muted)}

/* ---------- dialogs ---------- */
dialog{width:min(540px,calc(100vw - 24px));max-height:calc(100dvh - 40px);overflow:auto;padding:18px;border:1px solid var(--edge-strong);border-radius:16px;background:var(--panel);color:var(--ink)}
dialog::backdrop{background:rgba(9,13,17,.5)}
dialog h3{margin:0 0 6px;font:700 23px/1.2 var(--num)}
dialog h3:focus{outline:none}
dialog h4{margin:16px 0 6px;font:600 15px/1.2 var(--text)}
dialog p{margin:0 0 6px}
dialog .sub{font-size:14px;color:var(--muted)}
.dlg-actions{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:18px}
.dlg-actions .spacer{flex:1}
#confirmDlg .dlg-actions{justify-content:flex-end}
.mini{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:3px;margin-top:12px}
.mcell{aspect-ratio:1/1.1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6%;border:1px solid var(--edge);border-radius:6px;container-type:inline-size}
.mcell .sticker{font-size:clamp(9px,36cqi,15px);box-shadow:0 0 0 1px rgba(0,0,0,.08)}
.mcell .count{font-size:clamp(9px,34cqi,15px)}
.lastlist{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:2px 14px;font-size:14px}
.lastlist li{display:flex;justify-content:space-between;gap:6px;padding:4px 0;border-bottom:1px solid var(--edge)}
.lastlist b{font:700 16px/1 var(--num);font-variant-numeric:tabular-nums}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:calc(66px + env(safe-area-inset-bottom));z-index:20;transform:translateX(-50%);display:flex;align-items:center;gap:10px;width:max-content;max-width:calc(100vw - 24px);padding:10px 10px 10px 16px;border-radius:12px;background:var(--primary);color:var(--primary-ink);font-size:15px;box-shadow:0 8px 28px rgba(0,0,0,.28)}
.toast button{padding:8px 6px;border:0;background:none;color:inherit;font:600 15px var(--text);text-decoration:underline;cursor:pointer}

/* ---------- phone on its side ---------- */
@media (orientation:landscape) and (max-height:540px){
  .app{grid-template-columns:minmax(0,1fr) clamp(190px,30vw,270px);grid-template-rows:auto auto minmax(0,1fr) auto;grid-template-areas:"main top" "main banners" "main lastbar" "main tabs";padding-bottom:env(safe-area-inset-bottom)}
  .top{flex-direction:column;align-items:flex-start;gap:6px;padding:10px 12px 6px}
  .total{text-align:left}
  .banners{padding:0 10px 0 0}
  .lastbar{flex-direction:column;align-items:stretch;justify-content:flex-end;padding:6px 12px 10px}
  #undoBtn{width:100%}
  .tabs{grid-template-columns:1fr;padding-bottom:0}
  .tabs button{min-height:42px;padding-left:12px;text-align:left}
  .tabs button[aria-current="page"]::before{top:22%;bottom:22%;left:0;right:auto;width:3px;height:auto;border-radius:0 3px 3px 0}
  #view-count{padding:8px 4px 8px 10px}
  .toast{bottom:calc(16px + env(safe-area-inset-bottom))}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div>
      <h1 id="dayLabel">Today</h1>
      <p class="sub" id="daySub">No sales yet</p>
    </div>
    <p class="total"><b id="total">0</b><span>sold</span></p>
  </header>

  <div class="banners">
    <div class="banner" id="staleBanner" hidden>
      <p id="staleText"></p>
      <button type="button" class="btn small" id="staleKeep">Keep counting</button>
      <button type="button" class="btn small primary" id="staleEod">End of day</button>
    </div>
    <div class="banner warn" id="storeBanner" role="alert" hidden>
      <p id="storeText"></p>
      <button type="button" class="btn small" id="storeDismiss">Dismiss</button>
    </div>
  </div>

  <main>
    <section class="view" id="view-count" aria-label="Count sales">
      <div class="grid" id="grid"></div>
    </section>

    <section class="view" id="view-eod" aria-labelledby="eodHeading" hidden>
      <div class="pane">
        <h2 id="eodHeading">End of day</h2>
        <p class="lede" id="eodSummary"></p>
        <p class="hint">Check each count, type the last ticket number left in each box, then close the day.</p>
        <div class="rowhead" aria-hidden="true"><span>Box</span><span>Sold</span><span>Adjust</span><span>Last ticket #</span></div>
        <ul class="rows" id="eodRows"></ul>
        <div class="eod-actions">
          <button type="button" class="btn primary wide" id="closeDayBtn">Close day</button>
          <button type="button" class="btn textbtn danger" id="clearDayBtn">Clear this count</button>
        </div>
      </div>
    </section>

    <section class="view" id="view-history" aria-labelledby="histHeading" hidden>
      <div class="pane">
        <h2 id="histHeading">History</h2>
        <p class="lede" id="histSummary"></p>
        <div class="exports">
          <button type="button" class="btn exp" id="expTotals"><span>Daily totals</span><small>CSV, one row per box per day</small></button>
          <button type="button" class="btn exp" id="expSales"><span>Every sale</span><small>CSV with the time of each sale</small></button>
          <button type="button" class="btn exp" id="expBackup"><span>Back up</span><small>All data, as a file to restore</small></button>
          <button type="button" class="btn exp" id="expRestore"><span>Restore</span><small>Replace this device’s data</small></button>
        </div>
        <input type="file" id="restoreInput" accept="application/json,.json" class="visually-hidden" tabindex="-1" aria-hidden="true">
        <p class="note" id="backupNote"></p>
        <ul class="days" id="dayList"></ul>
        <p class="empty" id="historyEmpty">No closed days yet. Each day you close on the End of day screen is kept here.</p>
      </div>
    </section>
  </main>

  <div class="lastbar" id="lastbar">
    <p id="lastMsg" aria-live="polite"></p>
    <button type="button" class="btn" id="undoBtn" disabled>Undo</button>
  </div>

  <nav class="tabs" aria-label="Screens">
    <button type="button" data-view="count" aria-current="page">Count</button>
    <button type="button" data-view="eod">End of day</button>
    <button type="button" data-view="history">History</button>
  </nav>
</div>

<dialog id="confirmDlg" aria-labelledby="cTitle">
  <h3 id="cTitle"></h3>
  <p id="cBody"></p>
  <div class="dlg-actions">
    <button type="button" class="btn" id="cCancel" autofocus>Cancel</button>
    <button type="button" class="btn primary" id="cOk">OK</button>
  </div>
</dialog>

<dialog id="dayDlg" aria-labelledby="dTitle">
  <h3 id="dTitle" tabindex="-1" autofocus></h3>
  <p class="sub" id="dSub"></p>
  <div class="mini" id="dGrid"></div>
  <div id="dLastWrap">
    <h4>Last ticket numbers</h4>
    <ul class="lastlist" id="dLast"></ul>
  </div>
  <div class="dlg-actions">
    <button type="button" class="btn textbtn danger" id="dDelete">Delete day</button>
    <span class="spacer"></span>
    <button type="button" class="btn" id="dReopen">Reopen</button>
    <button type="button" class="btn primary" id="dDone">Done</button>
  </div>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
(() => {
'use strict';

const BOXES = 48;
const NS = 'lotteryTally.v1.';           // all GitHub Pages sites of one account share storage, so keys are namespaced
const KEY = { current: NS + 'current', history: NS + 'history', ui: NS + 'ui' };
const $ = (sel) => document.querySelector(sel);

/* ---------- storage ---------- */
let canStore = true;
let saveFailed = false;
let notice = '';
try { localStorage.setItem(NS + 'probe', '1'); localStorage.removeItem(NS + 'probe'); }
catch (e) { canStore = false; }

function load(key) {
  if (!canStore) return undefined;
  let raw;
  try { raw = localStorage.getItem(key); } catch (e) { return undefined; }
  if (raw == null) return undefined;
  try { return JSON.parse(raw); }
  catch (e) {
    try { localStorage.setItem(key + '.unreadable.' + Date.now(), raw); } catch (_) { /* keep going */ }
    notice = 'Some saved data could not be read. A copy was kept in this browser.';
    return undefined;
  }
}
function store(key, value) {
  if (!canStore) return false;
  let ok = true;
  try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { ok = false; }
  if (saveFailed !== !ok) { saveFailed = !ok; renderStorageWarning(); }
  return ok;
}

/* ---------- data ----------
   A day: { id, start, end, taps, last }
   start = epoch ms of the day's first activity (null until then)
   taps  = [box, seconds after start] per sale, with a trailing 1 when added by hand
   last  = { box: "last ticket number" } typed at the end of the day */
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const newDay = () => ({ id: uid(), start: null, end: null, taps: [], last: {} });
const hasData = (d) => d.taps.length > 0 || Object.keys(d.last).length > 0;

function cleanDay(d) {
  if (!d || typeof d !== 'object' || typeof d.id !== 'string' || !d.id) return null;
  const taps = [];
  if (Array.isArray(d.taps)) {
    for (const t of d.taps) {
      if (!Array.isArray(t) || !Number.isInteger(t[0]) || t[0] < 1 || t[0] > BOXES || !Number.isFinite(t[1])) continue;
      const off = Math.max(0, Math.round(t[1]));
      taps.push(t[2] ? [t[0], off, 1] : [t[0], off]);
    }
  }
  const last = {};
  if (d.last && typeof d.last === 'object') {
    for (const k of Object.keys(d.last)) {
      const b = Number(k);
      const v = typeof d.last[k] === 'string' ? d.last[k].replace(/\D/g, '').slice(0, 6) : '';
      if (Number.isInteger(b) && b >= 1 && b <= BOXES && v) last[b] = v;
    }
  }
  let start = Number.isFinite(d.start) ? d.start : null;
  const end = Number.isFinite(d.end) ? d.end : null;
  if (start == null && (taps.length || Object.keys(last).length)) start = end != null ? end : Date.now();
  return { id: d.id, start, end, taps, last };
}

let current, history, ui;
function readAll() {
  current = cleanDay(load(KEY.current)) || newDay();
  const h = load(KEY.history);
  history = (Array.isArray(h) ? h : []).map(cleanDay).filter((d) => d && d.start != null);
  history.sort((a, b) => a.start - b.start);
  if (history.some((d) => d.id === current.id)) current = newDay();   // day was closed but the reset never saved
  const u = load(KEY.ui);
  ui = u && typeof u === 'object' && !Array.isArray(u) ? u : {};
}
readAll();

function countsOf(day) {
  const c = new Array(BOXES + 1).fill(0);
  for (const t of day.taps) c[t[0]]++;
  return c;
}
function maxOf(c) { let m = 0; for (let b = 1; b <= BOXES; b++) if (c[b] > m) m = c[b]; return m; }
function countFor(box) { let n = 0; for (const t of current.taps) if (t[0] === box) n++; return n; }
const tapTime = (day, t) => day.start + t[1] * 1000;
const offsetFor = (now) => Math.max(0, Math.round((now - current.start) / 1000));

let persistAsked = false;
function saveCurrent() {
  const ok = store(KEY.current, current);
  if (ok && !persistAsked) {
    persistAsked = true;
    const s = navigator.storage;
    if (s && s.persist && s.persisted) s.persisted().then((p) => p || s.persist()).catch(() => {});
  }
  return ok;
}
const saveHistory = () => store(KEY.history, history);
const saveUI = () => store(KEY.ui, ui);

/* ---------- formatting ---------- */
const fmt = (o) => new Intl.DateTimeFormat(undefined, o);
const F = {
  long: fmt({ weekday: 'long', month: 'long', day: 'numeric' }),
  longY: fmt({ weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' }),
  short: fmt({ weekday: 'short', month: 'short', day: 'numeric' }),
  shortY: fmt({ month: 'short', day: 'numeric', year: 'numeric' }),
  time: fmt({ hour: 'numeric', minute: '2-digit' }),
  weekdayEn: new Intl.DateTimeFormat('en-US', { weekday: 'long' }),
};
const sameYear = (ms) => new Date(ms).getFullYear() === new Date().getFullYear();
const longDate = (ms) => (sameYear(ms) ? F.long : F.longY).format(ms);
const shortDate = (ms) => (sameYear(ms) ? F.short : F.shortY).format(ms);
const timeOf = (ms) => F.time.format(ms);
function sameDate(a, b) {
  const x = new Date(a), y = new Date(b);
  return x.getFullYear() === y.getFullYear() && x.getMonth() === y.getMonth() && x.getDate() === y.getDate();
}
const p2 = (n) => String(n).padStart(2, '0');
function ymd(ms) { const d = new Date(ms); return `${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())}`; }
function hms(ms) { const d = new Date(ms); return `${p2(d.getHours())}:${p2(d.getMinutes())}:${p2(d.getSeconds())}`; }
function isoLocal(ms) {
  const off = -new Date(ms).getTimezoneOffset();
  const a = Math.abs(off);
  return `${ymd(ms)}T${hms(ms)}${off >= 0 ? '+' : '-'}${p2(Math.floor(a / 60))}:${p2(a % 60)}`;
}
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
const heat = (n, max) => (n && max ? Math.round(14 + 56 * (n / max)) : 0);   // % of gold mixed into a slot

/* ---------- build ---------- */
const grid = $('#grid');
const cells = [null];
for (let b = 1; b <= BOXES; b++) {
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'cell';
  btn.dataset.box = b;
  btn.innerHTML = `<span class="in"><span class="sticker">${b}</span><span class="count"></span></span>`;
  btn.addEventListener('animationend', (e) => { if (e.target === btn) btn.classList.remove('hit'); });
  grid.appendChild(btn);
  cells.push(btn);
}

const rowsEl = $('#eodRows');
const rows = [null];
for (let b = 1; b <= BOXES; b++) {
  const li = document.createElement('li');
  li.className = 'row';
  li.dataset.box = b;
  li.innerHTML =
    `<span class="sticker">${b}</span>` +
    `<span class="sold"><b>0</b><span class="bar"><i></i></span></span>` +
    `<span class="step"><button type="button" class="btn minus" aria-label="Remove one sale from Box ${b}">−</button>` +
    `<button type="button" class="btn plus" aria-label="Add one sale to Box ${b}">+</button></span>` +
    `<label class="lastnum"><input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" ` +
    `autocorrect="off" spellcheck="false" enterkeyhint="${b < BOXES ? 'next' : 'done'}" placeholder="–" ` +
    `aria-label="Last ticket number, Box ${b}"><small></small></label>`;
  rowsEl.appendChild(li);
  rows.push(li);
}

/* ---------- actions ---------- */
let lastMsg = '';

function tap(box) {
  const now = Date.now();
  if (current.start == null) current.start = now;
  current.taps.push([box, offsetFor(now)]);
  saveCurrent();
  lastMsg = `Counted Box <b>${box}</b>, now ${countFor(box)}.`;
  renderCount();
  const el = cells[box];
  el.classList.remove('hit');
  void el.offsetWidth;   // restart the animation on quick repeat taps
  el.classList.add('hit');
  if (navigator.vibrate) { try { navigator.vibrate(12); } catch (_) { /* not supported */ } }
}

function undo() {
  const t = current.taps.pop();
  if (!t) return;
  if (!hasData(current)) current.start = null;
  saveCurrent();
  lastMsg = `Removed one from Box <b>${t[0]}</b>, now ${countFor(t[0])}.`;
  renderCount();
}

function addManual(box) {
  const now = Date.now();
  if (current.start == null) current.start = now;
  current.taps.push([box, offsetFor(now), 1]);
  saveCurrent();
  lastMsg = '';
  renderAll();
}

function removeOne(box) {
  for (let i = current.taps.length - 1; i >= 0; i--) {
    if (current.taps[i][0] === box) { current.taps.splice(i, 1); break; }
  }
  if (!hasData(current)) current.start = null;
  saveCurrent();
  lastMsg = '';
  renderAll();
}

function setLast(box, raw) {
  const v = String(raw).replace(/\D/g, '').slice(0, 6);
  if (v) current.last[box] = v; else delete current.last[box];
  if (v && current.start == null) current.start = Date.now();
  if (!hasData(current)) current.start = null;
  saveCurrent();
  renderHeader(); renderEodSummary(); renderBanner();
}

function closeDay() {
  const day = { ...current, end: Date.now() };
  history.push(day);
  history.sort((a, b) => a.start - b.start);
  if (canStore && !saveHistory()) {
    history = history.filter((d) => d.id !== day.id);
    toast('The day could not be saved. Back up from History, then try again.');
    return;
  }
  current = newDay();
  saveCurrent();
  lastMsg = '';
  show('count');
  renderAll();
  toast(`Saved ${shortDate(day.start)} with ${plural(day.taps.length, 'sale', 'sales')}.`, 'Reopen', () => { if (reopenLatest()) show('eod'); });
}

function reopenLatest() {
  if (hasData(current)) { toast('Clear the current count before reopening a day.'); return false; }
  const day = history[history.length - 1];
  if (!day) return false;
  history = history.slice(0, -1);
  current = { ...day, end: null };
  saveCurrent();
  saveHistory();
  lastMsg = '';
  renderAll();
  toast(`Reopened ${shortDate(day.start)}.`);
  return true;
}

/* ---------- rendering ---------- */
function renderHeader() {
  const started = current.start != null;
  $('#dayLabel').textContent = longDate(started ? current.start : Date.now());
  $('#daySub').textContent = !started ? 'No sales yet'
    : sameDate(current.start, Date.now()) ? `Since ${timeOf(current.start)}`
    : `Since ${shortDate(current.start)}, ${timeOf(current.start)}`;
  $('#total').textContent = current.taps.length;
}

function renderGrid() {
  const c = countsOf(current), max = maxOf(c);
  for (let b = 1; b <= BOXES; b++) {
    const el = cells[b];
    el.querySelector('.count').textContent = c[b] ? String(c[b]) : '';
    el.classList.toggle('sold', c[b] > 0);
    el.style.setProperty('--hp', heat(c[b], max) + '%');
    el.setAttribute('aria-label', `Box ${b}, ${c[b]} sold`);
  }
}

function renderLastbar() {
  const t = current.taps[current.taps.length - 1];
  const undoBtn = $('#undoBtn');
  undoBtn.disabled = !t;
  undoBtn.textContent = t ? `Undo ${t[0]}` : 'Undo';
  undoBtn.setAttribute('aria-label', t ? `Undo the last sale, Box ${t[0]}` : 'Undo');
  $('#lastMsg').innerHTML = lastMsg
    || (t ? `Last sale: Box <b>${t[0]}</b> at ${timeOf(tapTime(current, t))}.` : 'Tap a box each time a ticket sells.');
}

function renderBanner() {
  const stale = current.start != null && !sameDate(current.start, Date.now()) && ui.staleOk !== current.id;
  $('#staleBanner').hidden = !stale;
  if (stale) $('#staleText').textContent = `Still counting ${longDate(current.start)}. Close that day before counting today’s sales?`;
}

function renderStorageWarning() {
  const text = !canStore ? 'This browser is not saving counts. Back up from History before you close the page.'
    : saveFailed ? 'The last change could not be saved (storage may be full). Back up from History now.'
    : notice;
  $('#storeBanner').hidden = !text;
  $('#storeText').textContent = text;
  $('#storeDismiss').hidden = !canStore ? true : saveFailed;
}

function renderEodSummary() {
  const c = countsOf(current);
  let boxes = 0;
  for (let b = 1; b <= BOXES; b++) if (c[b]) boxes++;
  const n = current.taps.length;
  const filled = Object.keys(current.last).length;
  $('#eodSummary').textContent = (n ? `${plural(n, 'sale', 'sales')} from ${plural(boxes, 'box', 'boxes')}.` : 'No sales counted yet.')
    + ` Last ticket # entered for ${filled} of ${BOXES}.`;
  $('#closeDayBtn').disabled = !hasData(current);
  $('#clearDayBtn').disabled = !hasData(current);
}

function renderEod() {
  const c = countsOf(current), max = maxOf(c);
  const prevDay = history[history.length - 1];
  for (let b = 1; b <= BOXES; b++) {
    const li = rows[b];
    li.querySelector('.sold b').textContent = c[b];
    li.querySelector('.bar i').style.width = max ? `${(c[b] / max) * 100}%` : '0%';
    li.querySelector('.minus').disabled = c[b] === 0;
    li.classList.toggle('zero', c[b] === 0);
    const input = li.querySelector('input');
    if (document.activeElement !== input) input.value = current.last[b] || '';
    const prev = prevDay && prevDay.last[b];
    li.querySelector('small').textContent = prev ? `prev ${prev}` : '';
  }
  renderEodSummary();
}

function renderHistory() {
  const list = $('#dayList');
  list.textContent = '';
  $('#historyEmpty').hidden = history.length > 0;
  $('#histSummary').textContent = history.length ? `${plural(history.length, 'closed day', 'closed days')} on this device.` : '';
  for (let i = history.length - 1; i >= 0; i--) {
    const d = history[i], c = countsOf(d);
    let top = 0;
    for (let b = 1; b <= BOXES; b++) if (c[b] > (top ? c[top] : 0)) top = b;
    const li = document.createElement('li');
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'dayrow';
    btn.dataset.id = d.id;
    btn.innerHTML = '<span><span class="d"></span><small></small></span><b></b>';
    btn.querySelector('.d').textContent = longDate(d.start);
    btn.querySelector('small').textContent = top ? `Most sold: Box ${top} (${c[top]})` : 'No sales counted';
    btn.querySelector('b').textContent = d.taps.length;
    btn.setAttribute('aria-label', `${longDate(d.start)}, ${plural(d.taps.length, 'sale', 'sales')}`);
    li.appendChild(btn);
    list.appendChild(li);
  }
  const t = ui.lastBackup;
  $('#backupNote').textContent = 'Counts are saved only in this browser on this device. Last backup: '
    + (t ? (sameDate(t, Date.now()) ? `today at ${timeOf(t)}` : shortDate(t)) : 'never') + '.';
}

function renderCount() { renderHeader(); renderGrid(); renderLastbar(); renderBanner(); }
function renderAll() {
  renderCount();
  renderStorageWarning();
  if (view === 'eod') renderEod();
  if (view === 'history') renderHistory();
}

/* ---------- views ---------- */
let view = 'count';
function show(v) {
  view = v;
  for (const name of ['count', 'eod', 'history']) $('#view-' + name).hidden = name !== v;
  $('#lastbar').hidden = v !== 'count';
  document.querySelectorAll('.tabs button').forEach((b) => {
    if (b.dataset.view === v) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
  });
  if (v === 'eod') renderEod();
  if (v === 'history') renderHistory();
}

/* ---------- dialogs and toast ---------- */
function confirmBox({ title, body, ok = 'OK', cancel = 'Cancel', danger = false }) {
  const dlg = $('#confirmDlg'), okBtn = $('#cOk'), cancelBtn = $('#cCancel');
  $('#cTitle').textContent = title;
  $('#cBody').textContent = body;
  okBtn.textContent = ok;
  cancelBtn.textContent = cancel;
  okBtn.className = 'btn ' + (danger ? 'danger-fill' : 'primary');
  return new Promise((resolve) => {
    let settled = false;
    const finish = (v) => {
      if (settled) return;
      settled = true;
      okBtn.onclick = cancelBtn.onclick = null;
      dlg.removeEventListener('close', onClose);
      if (dlg.open) dlg.close();
      resolve(v);
    };
    const onClose = () => finish(false);
    okBtn.onclick = () => finish(true);
    cancelBtn.onclick = () => finish(false);
    dlg.addEventListener('close', onClose);
    dlg.showModal();
  });
}

let toastTimer = 0;
function toast(msg, actionLabel, onAction) {
  const el = $('#toast');
  el.textContent = '';
  const span = document.createElement('span');
  span.textContent = msg;
  el.appendChild(span);
  if (actionLabel) {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = actionLabel;
    b.onclick = () => { el.hidden = true; onAction(); };
    el.appendChild(b);
  }
  el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, actionLabel ? 8000 : 3500);
}

let openDayId = null;
function openDay(id) {
  const d = history.find((x) => x.id === id);
  if (!d) return;
  openDayId = id;
  const c = countsOf(d), max = maxOf(c);
  $('#dTitle').textContent = longDate(d.start);
  let sub = plural(d.taps.length, 'sale', 'sales') + '.';
  if (d.taps.length) {
    const first = tapTime(d, d.taps.reduce((a, t) => (t[1] < a[1] ? t : a)));
    const last = tapTime(d, d.taps.reduce((a, t) => (t[1] > a[1] ? t : a)));
    sub += ` First sale ${timeOf(first)}, last sale ${sameDate(first, last) ? '' : shortDate(last) + ', '}${timeOf(last)}.`;
  }
  $('#dSub').textContent = sub;
  const g = $('#dGrid');
  g.textContent = '';
  for (let b = 1; b <= BOXES; b++) {
    const m = document.createElement('div');
    m.className = c[b] ? 'mcell sold' : 'mcell';
    m.style.setProperty('--hp', heat(c[b], max) + '%');
    m.innerHTML = `<span class="sticker">${b}</span><span class="count">${c[b] || ''}</span>`;
    m.setAttribute('aria-label', `Box ${b}, ${c[b]} sold`);
    g.appendChild(m);
  }
  const lastList = $('#dLast');
  lastList.textContent = '';
  const keys = Object.keys(d.last).map(Number).sort((a, b) => a - b);
  for (const b of keys) {
    const li = document.createElement('li');
    li.innerHTML = `<span>Box ${b}</span><b></b>`;
    li.querySelector('b').textContent = d.last[b];
    lastList.appendChild(li);
  }
  $('#dLastWrap').hidden = keys.length === 0;
  const isLatest = history[history.length - 1] === d;
  $('#dReopen').hidden = !(isLatest && !hasData(current));
  const dlg = $('#dayDlg');
  dlg.showModal();
  dlg.scrollTop = 0;
}

/* ---------- export ---------- */
function csvCell(v) { const s = v == null ? '' : String(v); return /[",\r\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; }
const toCSV = (rowsOut) => rowsOut.map((r) => r.map(csvCell).join(',')).join('\r\n') + '\r\n';
function allDays() {
  const days = history.map((d) => ({ d, status: 'closed' }));
  if (hasData(current)) days.push({ d: current, status: 'open' });
  return days;
}

async function deliver(filename, text, type) {
  const blob = new Blob([text], { type });
  const touch = window.matchMedia && matchMedia('(pointer: coarse)').matches;
  if (touch && navigator.canShare && typeof File === 'function') {
    const file = new File([blob], filename, { type });
    if (navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: filename }); return true; }
      catch (e) { if (e && e.name === 'AbortError') return false; }   // other errors: fall back to a download
    }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 15000);
  return true;
}

function exportTotals() {
  const out = [['date', 'weekday', 'box', 'sold', 'last_ticket', 'status']];
  for (const { d, status } of allDays()) {
    const c = countsOf(d);
    for (let b = 1; b <= BOXES; b++) out.push([ymd(d.start), F.weekdayEn.format(d.start), b, c[b], d.last[b] || '', status]);
  }
  if (out.length === 1) { toast('Nothing to export yet.'); return; }
  deliver(`lottery-daily-totals-${ymd(Date.now())}.csv`, toCSV(out), 'text/csv');
}

function exportSales() {
  const out = [['day', 'day_status', 'timestamp', 'time', 'box', 'entry']];
  for (const { d, status } of allDays()) {
    for (const t of d.taps) {
      const ms = tapTime(d, t);
      out.push([ymd(d.start), status, isoLocal(ms), hms(ms), t[0], t[2] ? 'manual' : 'tap']);
    }
  }
  if (out.length === 1) { toast('Nothing to export yet.'); return; }
  deliver(`lottery-sales-${ymd(Date.now())}.csv`, toCSV(out), 'text/csv');
}

async function exportBackup() {
  const data = { app: 'lottery-tally', version: 1, exportedAt: isoLocal(Date.now()), boxes: BOXES, current, history };
  const ok = await deliver(`lottery-tally-backup-${ymd(Date.now())}.json`, JSON.stringify(data), 'application/json');
  if (ok) { ui.lastBackup = Date.now(); saveUI(); renderHistory(); }
}

async function restoreFrom(file) {
  let data;
  try { data = JSON.parse(await file.text()); } catch (e) { data = null; }
  if (!data || data.app !== 'lottery-tally' || !Array.isArray(data.history)) {
    toast('That file is not a Lottery Tally backup.');
    return;
  }
  const hist = data.history.map(cleanDay).filter((d) => d && d.start != null).sort((a, b) => a.start - b.start);
  let cur = cleanDay(data.current) || newDay();
  if (hist.some((d) => d.id === cur.id)) cur = newDay();
  const made = Date.parse(data.exportedAt);
  const ok = await confirmBox({
    title: 'Replace the data on this device?',
    body: `The backup${Number.isFinite(made) ? ` from ${shortDate(made)}, ${timeOf(made)}` : ''} has ${plural(hist.length, 'closed day', 'closed days')} and ${plural(cur.taps.length, 'sale', 'sales')} in its open count. `
      + `This device has ${plural(history.length, 'closed day', 'closed days')} and ${plural(current.taps.length, 'sale', 'sales')} in its open count, which will be replaced.`,
    ok: 'Replace',
    danger: true,
  });
  if (!ok) return;
  history = hist;
  current = cur;
  saveHistory();
  saveCurrent();
  lastMsg = '';
  renderAll();
  toast('Backup restored.');
}

/* ---------- events ---------- */
grid.addEventListener('click', (e) => {
  const c = e.target.closest('.cell');
  if (c) tap(Number(c.dataset.box));
});
document.addEventListener('touchstart', () => {}, { passive: true });   // lets iOS show :active on press
$('#undoBtn').addEventListener('click', undo);
document.querySelectorAll('.tabs button').forEach((b) => b.addEventListener('click', () => show(b.dataset.view)));

rowsEl.addEventListener('click', (e) => {
  const btn = e.target.closest('button');
  if (!btn) return;
  const box = Number(btn.closest('.row').dataset.box);
  if (btn.classList.contains('plus')) addManual(box);
  else if (btn.classList.contains('minus')) removeOne(box);
});
rowsEl.addEventListener('input', (e) => {
  if (e.target.matches('input')) setLast(Number(e.target.closest('.row').dataset.box), e.target.value);
});
rowsEl.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter' || !e.target.matches('input')) return;
  e.preventDefault();
  const next = rows[Number(e.target.closest('.row').dataset.box) + 1];
  if (next) next.querySelector('input').focus(); else e.target.blur();
});
rowsEl.addEventListener('focusout', (e) => {
  if (e.target.matches('input')) e.target.value = current.last[Number(e.target.closest('.row').dataset.box)] || '';
});

$('#closeDayBtn').addEventListener('click', async () => {
  if (!hasData(current)) return;
  const filled = Object.keys(current.last).length;
  const ok = await confirmBox({
    title: `Close ${longDate(current.start)}?`,
    body: `${plural(current.taps.length, 'sale', 'sales')}, last ticket # entered for ${filled} of ${BOXES} boxes. `
      + 'The day is saved to History and the count starts again at zero.',
    ok: 'Close day',
    cancel: 'Keep counting',
  });
  if (ok) closeDay();
});

$('#clearDayBtn').addEventListener('click', async () => {
  if (!hasData(current)) return;
  const ok = await confirmBox({
    title: 'Clear this count?',
    body: `This removes ${plural(current.taps.length, 'sale', 'sales')} and the last ticket numbers entered for ${longDate(current.start)}. It can’t be undone.`,
    ok: 'Clear count',
    danger: true,
  });
  if (!ok) return;
  current = newDay();
  saveCurrent();
  lastMsg = '';
  renderAll();
});

$('#staleEod').addEventListener('click', () => show('eod'));
$('#staleKeep').addEventListener('click', () => { ui.staleOk = current.id; saveUI(); renderBanner(); });
$('#storeDismiss').addEventListener('click', () => { notice = ''; renderStorageWarning(); });

$('#expTotals').addEventListener('click', exportTotals);
$('#expSales').addEventListener('click', exportSales);
$('#expBackup').addEventListener('click', exportBackup);
$('#expRestore').addEventListener('click', () => $('#restoreInput').click());
$('#restoreInput').addEventListener('change', (e) => {
  const file = e.target.files && e.target.files[0];
  e.target.value = '';
  if (file) restoreFrom(file);
});

$('#dayList').addEventListener('click', (e) => {
  const btn = e.target.closest('.dayrow');
  if (btn) openDay(btn.dataset.id);
});
$('#dDone').addEventListener('click', () => $('#dayDlg').close());
$('#dReopen').addEventListener('click', () => {
  $('#dayDlg').close();
  if (reopenLatest()) show('eod');
});
$('#dDelete').addEventListener('click', async () => {
  const d = history.find((x) => x.id === openDayId);
  $('#dayDlg').close();
  if (!d) return;
  const ok = await confirmBox({
    title: `Delete ${longDate(d.start)}?`,
    body: `This removes the day and its ${plural(d.taps.length, 'sale', 'sales')} from this device. It can’t be undone.`,
    ok: 'Delete day',
    danger: true,
  });
  if (!ok) return;
  history = history.filter((x) => x.id !== d.id);
  saveHistory();
  renderHistory();
  toast('Day deleted.');
});

// Another tab of the app changed the data: pick it up instead of overwriting it.
window.addEventListener('storage', (e) => {
  if (e.key === null || e.key === KEY.current || e.key === KEY.history || e.key === KEY.ui) {
    readAll();
    lastMsg = '';
    renderAll();
  }
});
document.addEventListener('visibilitychange', () => { if (!document.hidden) { renderHeader(); renderBanner(); renderLastbar(); } });
setInterval(() => { renderHeader(); renderBanner(); }, 60000);

/* ---------- start ---------- */
show('count');
renderAll();

if ('serviceWorker' in navigator && (location.protocol === 'https:' || /^(localhost|127\.0\.0\.1)$/.test(location.hostname))) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
})();
</script>
</body>
</html>
